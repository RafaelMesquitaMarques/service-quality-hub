# Serves the built SPA (replaces client/vercel.json in the container).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's hashed bundles: the file name changes with the content, so they
    # can be cached for good. A missing one is a real 404, never index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a React Router route (/tickets/..., /mobile/new, ...)
    # or a file from public/. index.html is revalidated on every load, so a
    # new deployment shows up on the next reload.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
